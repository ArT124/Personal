# Backup trigger for the daily reminders (cron-job.org is the main one, see dsa/README.md).
# Needs two repository secrets: APP_URL (e.g. https://daily-dsa.onrender.com) and CRON_SECRET.
# Note: GitHub may delay scheduled runs by several minutes and pauses them after 60 days without commits.
name: Daily DSA - reminder trigger

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set - skipping."; exit 0
          fi
          # The free server may be asleep; the first request wakes it (can take ~1 minute).
          curl -fsS --retry 4 --retry-delay 20 --max-time 90 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/cron/reminders"
